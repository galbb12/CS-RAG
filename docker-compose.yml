services:
  cs-rag-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://cs-rag-api:8000/v1
      - OPENAI_API_KEY=dummy
      - WEBUI_AUTH=false
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - cs-rag-api
    restart: unless-stopped

volumes:
  open-webui-data:
